name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/PlcDbSnapshot.Core.Tests -c Release
      - name: Build
        run: dotnet build src/PlcDbSnapshot.App/PlcDbSnapshot.App.csproj -c Release
      - name: Package
        shell: pwsh
        run: |
          $out = "src/PlcDbSnapshot.App/bin/Release/net48"
          New-Item -ItemType Directory -Force dist/PlcDbSnapshot | Out-Null
          Copy-Item "$out/*.exe","$out/*.dll","$out/*.config" dist/PlcDbSnapshot/
          Copy-Item README.md, LICENSE, THIRD_PARTY.md dist/PlcDbSnapshot/
      - uses: actions/upload-artifact@v4
        with:
          name: PlcDbSnapshot
          path: dist/PlcDbSnapshot
